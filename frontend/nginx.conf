server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses clean URLs (/jobs, /profile). If a file does not
    # exist, fall back to index.html so a direct link or refresh still works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets never change, so cache them aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it must pick up new asset hashes after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, always-revalidate";
    }
}
